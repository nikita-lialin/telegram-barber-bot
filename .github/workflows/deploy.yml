name: Deploy

# Запускается только после успешного workflow CI на push в main.
# workflow_run всегда берёт этот файл из main, а не из ветки PR.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Деплои идут строго по очереди; начатый деплой не отменяем.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_PROJECT_PATH: ${{ vars.VPS_PROJECT_PATH || 'telegram-barber-bot' }}
    steps:
      - name: Настроить SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Код на сервере обновляем до ровно того коммита, который прошёл CI.
      # reset --hard вместо pull: нет merge-конфликтов, сервер всегда равен репозиторию.
      # Неотслеживаемые файлы (.env) reset не трогает.
      - name: Обновить код и перезапустить
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_PROJECT_PATH" "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch --prune origin main
          git reset --hard "$2"
          docker compose up -d --build --remove-orphans
          docker compose ps
          docker image prune -f
          REMOTE
